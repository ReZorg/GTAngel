name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GTAngel.sln

      - name: Build
        run: dotnet build GTAngel.sln --configuration ${{ matrix.configuration }} --no-restore -p:EnableWindowsTargeting=true

      - name: Upload build artifact (Release only)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: GTAngel-Release
          path: GTAngel/bin/Release/net8.0-windows/
          if-no-files-found: error

  test:
    name: Unit Tests
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GTAngel.sln

      - name: Build (Debug - for tests)
        run: dotnet build GTAngel.sln --configuration Debug --no-restore -p:EnableWindowsTargeting=true

      - name: Run unit tests
        run: >-
          dotnet test GTAngel.Tests/GTAngel.Tests.csproj
          --configuration Debug
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --filter "Category!=E2E"
          -p:EnableWindowsTargeting=true

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: >-
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"TestResults/CoverageReport"
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura;TextSummary"
          -assemblyfilters:"+GTAngel"

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $summary = Get-Content "TestResults/CoverageReport/Summary.txt" -Raw
          Write-Host $summary
          $match = [regex]::Match($summary, 'Line coverage:\s*([\d.]+)%')
          if ($match.Success) {
            $coverage = [double]$match.Groups[1].Value
            Write-Host "Line coverage: $coverage%"
            if ($coverage -lt 40) {
              Write-Error "Coverage $coverage% is below the 40% minimum threshold"
              exit 1
            }
          } else {
            Write-Warning "Could not parse coverage from summary; skipping threshold check"
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/CoverageReport/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  test-e2e:
    name: E2E GameWorld Tests
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore GTAngel.sln

      - name: Build (Release - for E2E)
        run: dotnet build GTAngel.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Run E2E tests
        run: >-
          dotnet test GTAngel.Tests/GTAngel.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results-e2e.trx"
          --results-directory TestResults
          --filter "Category=E2E"
          -p:EnableWindowsTargeting=true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-e2e
          path: TestResults/

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit E2E Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

