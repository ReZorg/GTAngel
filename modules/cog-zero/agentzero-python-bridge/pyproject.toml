[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cog0"
dynamic = ["version"]
description = "Python interoperability bridge for the standalone cog0 Agent-Zero runtime"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{ name = "cogpy" }]
keywords = ["cog0", "agent-zero", "opencog", "atomspace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cogpy/cog-zero"
Repository = "https://github.com/cogpy/cog-zero"
Issues = "https://github.com/cogpy/cog-zero/issues"
Changelog = "https://github.com/cogpy/cog-zero/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cog0.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cog0*"]

[tool.setuptools.package-data]
cog0 = ["*.pyx", "*.pxd"]
