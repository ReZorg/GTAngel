              '- [ ] `MultiModalSensor` — unified interface for text, numeric, event, and visual inputs',
              '- [ ] `PerceptualProcessor` — converts raw inputs into AtomSpace representations',
              '- [ ] `AttentionManager` — ECAN-based attention allocation for incoming percepts',
